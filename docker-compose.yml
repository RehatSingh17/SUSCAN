version: "3.9"

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - analyse
      - ocr
      - rag
      - translate
    restart: always

  analyse:
    build: ./services/analyse
    env_file: .env
    environment:
      - OCR_SERVICE_URL=http://ocr:8002
      - RAG_SERVICE_URL=http://rag:8003
      - TRANSLATE_SERVICE_URL=http://translate:8004
    depends_on:
      - ocr
      - rag
      - translate
    restart: always

  ocr:
    build: ./services/ocr
    env_file: .env
    restart: always

  rag:
    build: ./services/rag
    env_file: .env
    environment:
      - CHROMA_DIR=/data/chroma_db
    volumes:
      - chroma_data:/data/chroma_db
    restart: always

  translate:
    build: ./services/translate
    env_file: .env
    restart: always

volumes:
  chroma_data:
